<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デイリーレポート 2026-08-04</title>
  <style>
/* ============================================
   知識統合システム — Daily Report Stylesheet
   ============================================ */

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap');

/* --- Reset & Base --- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #fafaf9;
  --bg-card: #ffffff;
  --text: #1a1a1a;
  --text-secondary: #555;
  --text-muted: #888;
  --border: #e5e5e5;
  --border-light: #f0f0f0;
  --accent: #2563eb;
  --accent-light: #dbeafe;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.08);
  --radius: 10px;
  --font-sans: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-serif: 'Noto Serif JP', serif;

  /* Domain colors */
  --color-tech: #2563eb;
  --color-music: #7c3aed;
  --color-piano: #1e1e1e;
  --color-golf: #16a34a;
  --color-anatomy: #dc2626;
  --color-bread: #a16207;
  --color-cs: #1e3a5f;
  --color-house-hunting: #ea580c;
  --color-deutsch: #ca8a04;
  --color-other: #6b7280;
  --color-x: #536471;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111111;
    --bg-card: #1c1c1c;
    --text: #e5e5e5;
    --text-secondary: #aaa;
    --text-muted: #777;
    --border: #333;
    --border-light: #252525;
    --accent: #60a5fa;
    --accent-light: #1e3a5f;
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-hover: 0 4px 12px rgba(0,0,0,0.4);
  }
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}

/* --- Layout --- */
.container {
  max-width: 860px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

/* --- Navigation --- */
.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.75rem 0;
  margin-bottom: 1.5rem;
  border-bottom: 1px solid var(--border-light);
  font-size: 0.875rem;
}
.nav a {
  color: var(--accent);
  text-decoration: none;
  transition: opacity 0.15s;
}
.nav a:hover { opacity: 0.7; }
.nav-prev::before { content: '← '; }
.nav-next::after { content: ' →'; }

/* --- Header --- */
.report-header {
  text-align: center;
  margin-bottom: 2.5rem;
}
.report-header h1 {
  font-family: var(--font-serif);
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  margin-bottom: 0.25rem;
}
.report-date {
  color: var(--text-muted);
  font-size: 0.9rem;
}

/* --- Domain Badge --- */
.badge {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 500;
  padding: 0.15em 0.6em;
  border-radius: 4px;
  color: #fff;
  white-space: nowrap;
  vertical-align: middle;
}
.badge-tech { background: var(--color-tech); }
.badge-music { background: var(--color-music); }
.badge-piano { background: var(--color-piano); }
.badge-golf { background: var(--color-golf); }
.badge-anatomy { background: var(--color-anatomy); }
.badge-bread { background: var(--color-bread); }
.badge-cs { background: var(--color-cs); }
.badge-house-hunting { background: var(--color-house-hunting); }
.badge-deutsch { background: var(--color-deutsch); }
.badge-other { background: var(--color-other); }
.badge-x { background: var(--color-x); font-family: var(--font-serif); }

/* --- Topic Table --- */
.topic-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 2rem;
  font-size: 0.925rem;
}
.topic-table th {
  text-align: left;
  font-weight: 500;
  color: var(--text-muted);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 0.5rem 0.75rem;
  border-bottom: 2px solid var(--border);
}
.topic-table td {
  padding: 0.6rem 0.75rem;
  border-bottom: 1px solid var(--border-light);
  vertical-align: middle;
}
.topic-table tr:last-child td { border-bottom: none; }
.topic-table a {
  color: var(--accent);
  text-decoration: none;
}
.topic-table a:hover { text-decoration: underline; }

/* --- Section --- */
.section {
  margin-bottom: 2.5rem;
}
.section-title {
  font-family: var(--font-serif);
  font-size: 1.25rem;
  font-weight: 700;
  margin-bottom: 1rem;
  padding-bottom: 0.4rem;
  border-bottom: 2px solid var(--border);
}

/* --- Cards --- */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1rem;
  transition: box-shadow 0.2s;
  border-left: 4px solid var(--border);
}
.card:hover { box-shadow: var(--shadow-hover); }

.card-tech { border-left-color: var(--color-tech); }
.card-music { border-left-color: var(--color-music); }
.card-piano { border-left-color: var(--color-piano); }
.card-golf { border-left-color: var(--color-golf); }
.card-anatomy { border-left-color: var(--color-anatomy); }
.card-bread { border-left-color: var(--color-bread); }
.card-cs { border-left-color: var(--color-cs); }
.card-house-hunting { border-left-color: var(--color-house-hunting); }
.card-deutsch { border-left-color: var(--color-deutsch); }
.card-other { border-left-color: var(--color-other); }
.card-x { border-left-color: var(--color-x); }

.card-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.5rem;
  font-weight: 500;
}

.card p, .card li {
  color: var(--text-secondary);
  font-size: 0.925rem;
  line-height: 1.75;
}

/* --- Collapsible Details --- */
details {
  margin-bottom: 0.75rem;
}
details summary {
  cursor: pointer;
  font-weight: 500;
  padding: 0.5rem 0;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
details summary::before {
  content: '▸';
  display: inline-block;
  transition: transform 0.2s;
  font-size: 0.8em;
  color: var(--text-muted);
}
details[open] summary::before {
  transform: rotate(90deg);
}
details .detail-content {
  padding: 0.75rem 0 0.75rem 1.25rem;
  border-left: 2px solid var(--border-light);
  margin-left: 0.4rem;
}

/* --- Stats / Accumulation --- */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}
.stat-item {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 0.75rem 1rem;
  font-size: 0.875rem;
}
.stat-label {
  color: var(--text-muted);
  font-size: 0.8rem;
}
.stat-value {
  font-size: 1.25rem;
  font-weight: 700;
}

/* --- Insight blocks --- */
.insight {
  background: var(--accent-light);
  border-radius: var(--radius);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.25rem;
  border: 1px solid var(--accent);
  border-opacity: 0.2;
}
.insight h3 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
}
.insight p, .insight li {
  font-size: 0.925rem;
  line-height: 1.75;
}
.insight ul {
  padding-left: 1.25rem;
  margin-top: 0.5rem;
}

/* --- Connection blocks --- */
.connection {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1rem;
  position: relative;
}
.connection::before {
  content: '⟷';
  position: absolute;
  top: -0.6rem;
  left: 1.25rem;
  background: var(--bg);
  padding: 0 0.4rem;
  font-size: 0.9rem;
  color: var(--text-muted);
}
.connection h3 {
  font-size: 0.95rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
}
.connection p {
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.75;
}

/* --- Accumulation Table --- */
.acc-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
  margin-bottom: 1.5rem;
}
.acc-table th {
  text-align: left;
  font-weight: 500;
  color: var(--text-muted);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 0.5rem 0.75rem;
  border-bottom: 2px solid var(--border);
}
.acc-table td {
  padding: 0.5rem 0.75rem;
  border-bottom: 1px solid var(--border-light);
  vertical-align: top;
}
.acc-table tr:last-child td { border-bottom: none; }
.acc-table .domain-col { white-space: nowrap; }
.acc-table .count-col {
  text-align: center;
  font-weight: 700;
  font-size: 1rem;
}
.acc-table .coverage-col {
  color: var(--text-secondary);
  font-size: 0.85rem;
  line-height: 1.6;
}

/* --- Next Actions --- */
.actions-list {
  list-style: none;
  padding: 0;
}
.actions-list li {
  padding: 0.4rem 0 0.4rem 1.25rem;
  position: relative;
  font-size: 0.9rem;
  color: var(--text-secondary);
}
.actions-list li::before {
  content: '→';
  position: absolute;
  left: 0;
  color: var(--text-muted);
}

/* --- Footer --- */
.footer {
  text-align: center;
  padding-top: 2rem;
  margin-top: 2rem;
  border-top: 1px solid var(--border-light);
  color: var(--text-muted);
  font-size: 0.8rem;
}

/* --- Index page --- */
.index-header {
  text-align: center;
  margin-bottom: 3rem;
}
.index-header h1 {
  font-family: var(--font-serif);
  font-size: 2rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
}
.index-header p {
  color: var(--text-muted);
  font-size: 0.95rem;
}
.report-list {
  list-style: none;
  padding: 0;
}
.report-list li {
  border-bottom: 1px solid var(--border-light);
}
.report-list a {
  display: block;
  padding: 0.75rem 0.5rem;
  text-decoration: none;
  color: var(--text);
  transition: background 0.15s;
}
.report-list a:hover {
  background: var(--accent-light);
  border-radius: var(--radius);
}
.report-list .report-list-date {
  font-weight: 500;
  margin-right: 1rem;
}
.report-list .report-list-topics {
  color: var(--text-secondary);
  font-size: 0.875rem;
}

/* --- Responsive --- */
@media (max-width: 640px) {
  .container { padding: 1rem; }
  .report-header h1 { font-size: 1.35rem; }
  .stats-grid { grid-template-columns: 1fr; }
  .card { padding: 1rem; }
  .nav { font-size: 0.8rem; }
}

/* ============================================
   Self-contained report additions
   ============================================ */

/* --- Quick links bar (template links at the very top) --- */
.quicklinks {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem 1.1rem;
  padding: 0.55rem 0.1rem;
  margin-bottom: 0.25rem;
  font-size: 0.85rem;
  border-bottom: 1px solid var(--border-light);
}
.quicklinks a {
  color: var(--accent);
  text-decoration: none;
  white-space: nowrap;
}
.quicklinks a:hover { text-decoration: underline; }
.quicklinks a::after {
  content: " ↗";
  color: var(--text-muted);
  font-size: 0.85em;
}

/* --- 今日のX section — X (Twitter) 風レイアウト --- */
.x-section {
  --x-blue: #1d9bf0;
  --x-dim: #536471;
  --x-line: var(--border-light);
  --x-hover: rgba(15, 20, 25, 0.045);
}
@media (prefers-color-scheme: dark) {
  .x-section { --x-dim: #71767b; --x-hover: rgba(255, 255, 255, 0.06); }
}

/* --- account card (collapsible per-account) --- */
.x-account { padding: 0; overflow: hidden; }
.x-account > summary {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  cursor: pointer;
  padding: 0.7rem 1rem;
  list-style: none;
}
.x-account > summary::-webkit-details-marker { display: none; }
.x-account > summary::marker { content: ""; }
.x-account > summary:hover { background: var(--x-hover); }
.x-acc-avatar { flex: 0 0 auto; }
.x-acc-id { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
.x-acc-line { display: inline-flex; align-items: center; gap: 0.25rem; min-width: 0; max-width: 100%; }
.x-acc-name {
  font-weight: 700; font-size: 0.95rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.x-acc-handle { color: var(--x-dim); font-size: 0.85rem; white-space: nowrap; }
.x-count { color: var(--x-dim); font-size: 0.78rem; white-space: nowrap; }
.x-count-err { color: var(--color-anatomy); }
.x-acc-caret { flex: 0 0 auto; color: var(--x-dim); font-size: 0.75rem; transition: transform 0.2s; }
.x-account[open] .x-acc-caret { transform: rotate(180deg); }

/* --- avatars --- */
.x-avatar { width: 40px; height: 40px; border-radius: 9999px; object-fit: cover; background: var(--border-light); display: block; }
.x-avatar-mini { width: 18px; height: 18px; border-radius: 9999px; object-fit: cover; background: var(--border-light); display: inline-block; vertical-align: text-bottom; flex: 0 0 auto; }
.x-avatar-empty { display: inline-block; }
.x-avatar-link { flex: 0 0 auto; display: block; }

/* --- feed --- */
.x-feed { border-top: 1px solid var(--x-line); }
.x-tweet { padding: 0.75rem 1rem; border-bottom: 1px solid var(--x-line); transition: background 0.1s; }
.x-tweet:last-of-type { border-bottom: none; }
.x-tweet:hover { background: var(--x-hover); }
.x-repost-line {
  display: flex; align-items: center; gap: 0.4rem;
  font-size: 0.78rem; color: var(--x-dim); font-weight: 600;
  margin-bottom: 0.25rem; padding-left: 3.2rem;
}
.x-repost-line .x-ico { width: 1em; height: 1em; }
.x-repost-line a { color: var(--x-dim); text-decoration: none; }
.x-repost-line a:hover { text-decoration: underline; }

.x-tweet-row { display: flex; gap: 0.7rem; }
.x-tweet-main { flex: 1 1 auto; min-width: 0; }
.x-tweet-head { display: flex; align-items: center; gap: 0.25rem; flex-wrap: nowrap; overflow: hidden; line-height: 1.3; }
.x-name {
  font-weight: 700; color: var(--text); text-decoration: none; font-size: 0.93rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 1.4em;
}
.x-name:hover { text-decoration: underline; }
.x-verified { width: 1.05em; height: 1.05em; fill: var(--x-blue); flex: 0 0 auto; }
.x-handle { color: var(--x-dim); font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
.x-sep { color: var(--x-dim); font-size: 0.8rem; flex: 0 0 auto; }
.x-time { color: var(--x-dim); font-size: 0.9rem; text-decoration: none; white-space: nowrap; flex: 0 0 auto; }
.x-time:hover { text-decoration: underline; }
.x-replyto { font-size: 0.85rem; color: var(--x-dim); margin: 0.15rem 0; }
.x-replyto a { color: var(--x-blue); text-decoration: none; }
.x-replyto a:hover { text-decoration: underline; }

.x-text {
  margin-top: 0.15rem; color: var(--text); font-size: 0.95rem; line-height: 1.5;
  overflow-wrap: anywhere; word-break: break-word;
}
.x-text a { color: var(--x-blue); text-decoration: none; }
.x-text a:hover { text-decoration: underline; }

/* --- media grid --- */
.x-media-grid {
  margin-top: 0.6rem; display: grid; gap: 2px;
  border: 1px solid var(--x-line); border-radius: 16px; overflow: hidden; max-width: 100%;
}
.x-media-1 { grid-template-columns: 1fr; }
.x-media-2 { grid-template-columns: 1fr 1fr; }
.x-media-3 { grid-template-columns: 1fr 1fr; }
.x-media-3 .x-media-cell:first-child { grid-row: span 2; }
.x-media-4 { grid-template-columns: 1fr 1fr; }
.x-media-cell { position: relative; display: block; overflow: hidden; background: var(--border-light); }
.x-media-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.x-media-2 .x-media-cell,
.x-media-3 .x-media-cell:not(:first-child),
.x-media-4 .x-media-cell { aspect-ratio: 1 / 1; }
.x-media-1 .x-media-cell img { height: auto; max-height: 510px; }
.x-play {
  position: absolute; inset: 0; margin: auto; width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, 0.6); color: #fff; border-radius: 9999px; font-size: 0.95rem;
}
.x-media-more {
  position: absolute; right: 6px; bottom: 6px; background: rgba(0, 0, 0, 0.65); color: #fff;
  font-size: 0.72rem; padding: 0.12em 0.5em; border-radius: 6px;
}
.x-media-small { margin-top: 0.45rem; }
.x-media-small.x-media-grid { border-radius: 12px; }
.x-media-small .x-media-cell { aspect-ratio: 16 / 9; }
.x-media-small.x-media-1 .x-media-cell img { max-height: 240px; }
.x-media-chip { margin-top: 0.4rem; }
.x-media-chip a { color: var(--x-dim); font-size: 0.82rem; text-decoration: none; }
.x-media-chip a:hover { text-decoration: underline; }

/* --- quoted tweet card --- */
.x-quote-card {
  margin-top: 0.6rem; border: 1px solid var(--x-line); border-radius: 14px;
  padding: 0.6rem 0.8rem;
}
.x-quote-head { display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap; line-height: 1.3; }
.x-quote-name { font-weight: 700; color: var(--text); font-size: 0.88rem; }
.x-quote-handle, .x-quote-time { color: var(--x-dim); font-size: 0.82rem; }
.x-quote-text {
  margin-top: 0.2rem; color: var(--text); font-size: 0.9rem; line-height: 1.45;
  overflow-wrap: anywhere; word-break: break-word;
}
.x-quote-text a { color: var(--x-blue); text-decoration: none; }
.x-quote-text a:hover { text-decoration: underline; }
.x-quote-open { margin-top: 0.4rem; text-align: right; }
.x-quote-open a { color: var(--x-dim); font-size: 0.78rem; text-decoration: none; }
.x-quote-open a:hover { text-decoration: underline; }

/* --- engagement actions row --- */
.x-actions {
  display: flex; align-items: center; gap: 1.6rem; margin-top: 0.55rem;
  color: var(--x-dim); font-size: 0.8rem;
}
.x-act { display: inline-flex; align-items: center; gap: 0.3rem; color: inherit; text-decoration: none; }
.x-ico { width: 1.1em; height: 1.1em; fill: currentColor; flex: 0 0 auto; }
.x-act-n { font-variant-numeric: tabular-nums; }
.x-act-reply:hover { color: var(--x-blue); }
.x-act-rt:hover { color: #00ba7c; }
.x-act-like:hover { color: #f91880; }
.x-act-link { margin-left: auto; }
.x-act-link:hover { color: var(--x-blue); }

/* --- misc --- */
.x-error { color: var(--color-anatomy); font-size: 0.85rem; margin: 0.5rem 1rem; }
.x-more, .x-profile { margin: 0.7rem 1rem 0; font-size: 0.8rem; }
.x-more { color: var(--x-dim); border-top: 1px solid var(--x-line); padding-top: 0.7rem; }
.x-more a, .x-profile a { color: var(--x-dim); text-decoration: none; }
.x-more a:hover, .x-profile a:hover { text-decoration: underline; }
.x-quiet { margin-top: 0.7rem; font-size: 0.8rem; color: var(--text-muted); }
.x-quiet a { color: var(--text-muted); text-decoration: none; }
.x-quiet a:hover { text-decoration: underline; }

@media (max-width: 640px) {
  .x-tweet { padding-left: 0.7rem; padding-right: 0.7rem; }
  .x-repost-line { padding-left: 2.7rem; }
}
@media print {
  .x-account[open] .x-feed { display: block; }
  .x-act-link, .x-acc-caret { display: none; }
}

/* --- Section heading controls (expand / collapse all) --- */
.section-controls {
  float: right;
  font-size: 0.75rem;
  font-weight: 400;
  font-family: var(--font-sans);
}
.section-controls button {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  border-radius: 5px;
  padding: 0.2em 0.6em;
  margin-left: 0.3rem;
  cursor: pointer;
  font: inherit;
}
.section-controls button:hover { background: var(--border-light); }
.section-note {
  color: var(--text-muted);
  font-size: 0.825rem;
  margin-bottom: 1rem;
}
